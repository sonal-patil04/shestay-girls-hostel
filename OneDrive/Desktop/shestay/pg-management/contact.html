  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
  <nav class="navbar">
    <div class="logo">She<span>Stay</span> 🌸</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>

  <section class="section">
    <h1 class="section-title">Contact Us</h1>

    <form class="contact-form" id="contactForm">
      <input type="text" id="contactName" placeholder="Enter Name" required>
      <input type="email" id="contactEmail" placeholder="Enter Email" required>
      <input type="tel" id="contactPhone" placeholder="Enter Phone" required>
      <textarea id="contactMessage" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit" class="btn">Submit</button>
      <p id="contactSuccess" style="display:none; color:#15803d; font-weight:bold; text-align:center;"></p>
    </form>
  </section>

  <footer><p>SheStay Girls Hostel &copy; 2026</p></footer>
  <script type="module" src="js/script.js"></script>
</body>
